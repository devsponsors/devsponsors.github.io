name: Daily DevSponsors Stats Sync

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Stats Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_stats.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "DevSponsors Bot"
          git config --global user.email "bot@devsponsors.github.io"
          git add data/devs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update developer stats and activity [skip ci]" && git push origin main)
